name: Tests

on:
  push:
    branches: [dev, "stack/**"]
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -r requirements-dev.txt
      - name: Migrate (SQLite — Railway-compatible default)
        run: python manage.py migrate --noinput
        env:
          DEBUG: "True"
      - name: Pytest
        run: pytest
        env:
          DEBUG: "True"
