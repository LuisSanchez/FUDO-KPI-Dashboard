name: Tests

on:
  push:
    branches: [main, dev, "stack/**"]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Migrate (SQLite — Railway-compatible default)
        run: python manage.py migrate --noinput
        env:
          DEBUG: "True"
      - name: Ruff lint
        run: ruff check .
      - name: Pytest + coverage ≥75%
        run: pytest
        env:
          DEBUG: "True"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci || npm install
      - name: ESLint
        run: npm run lint
      - name: Unit tests + coverage ≥75%
        run: npm run test:ci
