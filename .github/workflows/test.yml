# Unit tests — does NOT affect Railway deploy (Railway uses Dockerfile only).
name: Tests

on:
  push:
    branches: [dev, "stack/**"]
  pull_request:
    branches: [dev]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-test-key-not-for-production"
        run: pytest
